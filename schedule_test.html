

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Lessons - Music Scheduler</title>
    <style>

            padding: 0;

        }
        
        body {

            display: flex;
            align-items: center;

        .container {

        .btn-secondary {

        }
        
        .btn-secondary:hover {
            background: #4a5568;
        }
        
        .alert {
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 6px;
        }
        
        .alert-error {
            background: #fed7d7;
            color: #c53030;
            border: 1px solid #feb2b2;
        }
        
        .alert-success {

            color: #276749;
            border: 1px solid #9ae6b4;
        }
        
        .nav {
            margin-bottom: 2rem;
            text-align: center;
        }
        
        .nav a {
            color: #5a67d8;
            text-decoration: none;
            margin: 0 1rem;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        
        .nav a:hover {
            background: #e2e8f0;
        }
        
        .section {
            margin-bottom: 2rem;
            padding: 1.5rem;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
        }
        
        .section h2 {
            color: #2d3748;
            margin-bottom: 1rem;
            border-bottom: 2px solid #5a67d8;
            padding-bottom: 0.5rem;
        }
        
        .form-row {
            display: flex;
            gap: 1rem;
        }
        
        .form-row .form-group {
            flex: 1;
        }
        
        .list-item {
            padding: 0.75rem;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .list-item:last-child {
            border-bottom: none;
        }
        
        .badge {
            background: #5a67d8;

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        
        th, td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

            background: #f7fafc;

        }
        
        .status {
            display: inline-block;
            padding: 0.25rem 0.75rem;

            font-weight: 500;
        }
        
        .status.admin {
            background: #c6f6d5;

        }
        
        .status.instructor {

        }
    </style>

<body>
    <div class="container">
        
<div class="header">
    <h1>📝 Schedule Lessons</h1>
    <div class="nav">
        <a href="/instructor">← Back to Dashboard</a>
        <span>test</span>
        <a href="/logout">Logout</a>
    </div>
</div>





<!-- Schedule New Lesson Section -->
<div class="section">
    <h2>Schedule New Lesson</h2>
    <form id="schedule-form">
        <div class="form-row">
            <div class="form-group">
                <label for="student_id">Student:</label>
                <select id="student_id" name="student_id" required>
                    <option value="">Select a student...</option>
                </select>
            </div>
            <div class="form-group">
                <label for="lesson_date">Date:</label>
                <input type="date" id="lesson_date" name="lesson_date" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="lesson_time">Time:</label>
                <div id="time-slot-container">
                    <select id="lesson_time" name="lesson_time" required>
                        <option value="">First select a date and duration...</option>
                    </select>
                    <div id="availability-status" style="margin-top: 0.5rem; font-size: 0.9rem;"></div>
                </div>
            </div>
            <div class="form-group">
                <label for="duration">Duration (minutes):</label>
                <select id="duration" name="duration" required>
                    <option value="30">30 minutes</option>
                    <option value="45">45 minutes</option>
                    <option value="60" selected>60 minutes</option>
                    <option value="90">90 minutes</option>
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="instrument">Instrument:</label>
                <select id="instrument" name="instrument" required>
                    <option value="">Select instrument...</option>
                    <option value="Piano">Piano</option>
                    <option value="Guitar">Guitar</option>
                    <option value="Violin">Violin</option>
                    <option value="Drums">Drums</option>
                    <option value="Voice">Voice</option>
                    <option value="Saxophone">Saxophone</option>
                    <option value="Flute">Flute</option>
                    <option value="Trumpet">Trumpet</option>
                    <option value="Cello">Cello</option>
                    <option value="Bass">Bass</option>
                </select>
            </div>
            <div class="form-group">
                <label for="reminder_enabled">Reminder:</label>
                <select id="reminder_enabled" name="reminder_enabled">
                    <option value="true" selected>Enable reminder</option>
                    <option value="false">Disable reminder</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label for="notes">Notes (optional):</label>
            <textarea id="notes" name="notes" rows="3" placeholder="Any special notes for this lesson..."></textarea>
        </div>
        <button type="submit" class="btn">Schedule Lesson</button>
    </form>
</div>

<!-- Scheduled Lessons Section -->
<div class="section">
    <h2>My Scheduled Lessons</h2>
    <div style="margin-bottom: 1rem; display: flex; gap: 1rem; align-items: center;">
        <label for="filter-date" style="margin: 0;">Filter by date:</label>
        <input type="date" id="filter-date" style="padding: 0.5rem; border: 1px solid #e2e8f0; border-radius: 4px;">
        <button type="button" onclick="filterLessons()" class="btn" style="width: auto; margin: 0; padding: 0.5rem 1rem;">Filter</button>
        <button type="button" onclick="clearFilter()" class="btn btn-secondary" style="width: auto; margin: 0; padding: 0.5rem 1rem;">Clear</button>
    </div>
    <div id="scheduled-lessons">
        <p>Loading scheduled lessons...</p>
    </div>
</div>

<!-- Available Students Section -->
<div class="section">
    <h2>Available Students</h2>
    <div id="students-list">
        <p>Loading students...</p>
    </div>
</div>

<script>
let allLessons = [];
let allStudents = [];

document.addEventListener('DOMContentLoaded', function() {
    loadStudents();
    loadScheduledLessons();
    
    // Set minimum date to today
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('lesson_date').min = today;
    
    // Add event listeners for smart scheduling
    document.getElementById('lesson_date').addEventListener('change', updateAvailableTimeSlots);
    document.getElementById('duration').addEventListener('change', updateAvailableTimeSlots);
});

// Update available time slots based on selected date and duration
async function updateAvailableTimeSlots() {
    const dateInput = document.getElementById('lesson_date').value;
    const durationInput = document.getElementById('duration').value;
    const timeSelect = document.getElementById('lesson_time');
    const statusDiv = document.getElementById('availability-status');
    
    // Clear previous time slots
    timeSelect.innerHTML = '<option value="">Loading time slots...</option>';
    statusDiv.innerHTML = '';
    
    if (!dateInput || !durationInput) {
        timeSelect.innerHTML = '<option value="">Select date and duration first</option>';
        return;
    }
    
    try {
        const response = await fetch(`/api/valid-time-slots?date=${dateInput}&duration=${durationInput}`);
        const data = await response.json();
        
        if (response.ok) {
            if (data.valid_slots && data.valid_slots.length > 0) {
                // Populate time slots dropdown
                timeSelect.innerHTML = '<option value="">Select a time slot...</option>';
                data.valid_slots.forEach(slot => {
                    const option = document.createElement('option');
                    option.value = convertTo24Hour(slot.time);
                    option.textContent = `${slot.time} - ${slot.end_time} (${slot.duration} min)`;
                    timeSelect.appendChild(option);
                });
                
                statusDiv.innerHTML = `
                    <span style="color: #38a169;">
                        ✅ ${data.valid_slots.length} available time slot${data.valid_slots.length > 1 ? 's' : ''} found
                    </span>
                `;
            } else {
                timeSelect.innerHTML = '<option value="">No time slots available</option>';
                const message = data.message || 'No available time slots for this date and duration';
                statusDiv.innerHTML = `
                    <span style="color: #e53e3e;">
                        ❌ ${message}
                    </span>
                `;
            }
        } else {
            timeSelect.innerHTML = '<option value="">Error loading time slots</option>';
            statusDiv.innerHTML = `
                <span style="color: #e53e3e;">
                    ❌ ${data.error || 'Error loading available time slots'}
                </span>
            `;
        }
    } catch (error) {
        console.error('Error loading time slots:', error);
        timeSelect.innerHTML = '<option value="">Error loading time slots</option>';
        statusDiv.innerHTML = `
            <span style="color: #e53e3e;">
                ❌ Error loading available time slots
            </span>
        `;
    }
}

// Validate scheduling constraints before submission
async function validateSchedulingConstraints(formData) {
    try {
        const response = await fetch(`/api/valid-time-slots?date=${formData.lesson_date}&duration=${formData.duration}`);
        const data = await response.json();
        
        if (!response.ok) {
            return { valid: false, error: data.error || 'Error validating time slot' };
        }
        
        if (!data.valid_slots || data.valid_slots.length === 0) {
            return { valid: false, error: data.message || 'No available time slots for selected date and duration' };
        }
        
        // Check if the selected time is in the valid slots
        const selectedTime12h = convertTo12Hour(formData.lesson_time);
        const isValidTime = data.valid_slots.some(slot => slot.time === selectedTime12h);
        
        if (!isValidTime) {
            return { valid: false, error: 'Selected time slot is no longer available. Please refresh and select a valid time slot.' };
        }
        
        return { valid: true };
    } catch (error) {
        return { valid: false, error: 'Error validating scheduling constraints' };
    }
}

// Handle lesson scheduling form
document.getElementById('schedule-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const formData = {
        student_id: parseInt(document.getElementById('student_id').value),
        lesson_date: document.getElementById('lesson_date').value,
        lesson_time: document.getElementById('lesson_time').value,
        duration: parseInt(document.getElementById('duration').value),
        instrument: document.getElementById('instrument').value,
        reminder_enabled: document.getElementById('reminder_enabled').value === 'true',
        notes: document.getElementById('notes').value
    };
    
    if (!formData.student_id || !formData.lesson_date || !formData.lesson_time || !formData.instrument) {
        showAlert('Please fill in all required fields', 'error');
        return;
    }
    
    // Validate scheduling constraints
    const validation = await validateSchedulingConstraints(formData);
    if (!validation.valid) {
        showAlert(validation.error, 'error');
        // Refresh time slots to show current availability
        updateAvailableTimeSlots();
        return;
    }
    
    try {
        const response = await fetch('/api/instructor/lessons', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(formData)
        });
        
        const result = await response.json();
        
        if (response.ok) {
            showAlert(result.message, 'success');
            // Reset form
            document.getElementById('schedule-form').reset();
            // Reload lessons
            loadScheduledLessons();
        } else {
            showAlert(result.error || 'Failed to schedule lesson', 'error');
        }
    } catch (error) {
        console.error('Error scheduling lesson:', error);
        showAlert('Error scheduling lesson', 'error');
    }
});

async function loadStudents() {
    try {
        const response = await fetch('/api/instructor/students');
        const data = await response.json();
        
        if (data.students) {
            allStudents = data.students;
            const studentSelect = document.getElementById('student_id');
            const studentsList = document.getElementById('students-list');
            
            // Populate dropdown
            studentSelect.innerHTML = '<option value="">Select a student...</option>';
            data.students.forEach(student => {
                const option = document.createElement('option');
                option.value = student.id;
                option.textContent = `${student.name} - ${student.instrument}`;
                studentSelect.appendChild(option);
            });
            
            // Populate students list
            if (data.students.length === 0) {
                studentsList.innerHTML = '<p>No students available.</p>';
            } else {
                const table = `
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Instrument</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${data.students.map(student => `
                                <tr>
                                    <td>${student.name}</td>
                                    <td>${student.email || 'N/A'}</td>
                                    <td>${student.phone || 'N/A'}</td>
                                    <td><span class="badge">${student.instrument}</span></td>
                                    <td>
                                        <button type="button" class="btn" style="background: #38a169; padding: 0.25rem 0.5rem; margin: 0;" onclick="selectStudentForLesson(${student.id}, '${student.name}', '${student.instrument}')">Select for Lesson</button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
                studentsList.innerHTML = table;
            }
        }
    } catch (error) {
        console.error('Error loading students:', error);
        document.getElementById('students-list').innerHTML = '<p>Error loading students.</p>';
    }
}

async function loadScheduledLessons() {
    try {
        const response = await fetch('/api/instructor/lessons');
        const data = await response.json();
        
        if (data.lessons) {
            allLessons = data.lessons;
            displayLessons(data.lessons);
        }
    } catch (error) {
        console.error('Error loading lessons:', error);
        document.getElementById('scheduled-lessons').innerHTML = '<p>Error loading lessons.</p>';
    }
}

function displayLessons(lessons) {
    const scheduledLessons = document.getElementById('scheduled-lessons');
    
    if (lessons.length === 0) {
        scheduledLessons.innerHTML = '<p>No lessons scheduled.</p>';
        return;
    }
    
    // Sort lessons by date and time
    const sortedLessons = lessons.sort((a, b) => {
        const dateA = new Date(a.lesson_date + ' ' + a.lesson_time);
        const dateB = new Date(b.lesson_date + ' ' + b.lesson_time);
        return dateB - dateA; // Most recent first
    });
    
    const table = `
        <table>
            <thead>
                <tr>
                    <th>Student</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Duration</th>
                    <th>Instrument</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                ${sortedLessons.map(lesson => {
                    const lessonDateTime = new Date(lesson.lesson_date + ' ' + convertTo24Hour(lesson.lesson_time || '12:00'));
                    const now = new Date();
                    const isPast = lessonDateTime < now;
                    const isToday = lesson.lesson_date === new Date().toISOString().split('T')[0];
                    const status = isPast ? 'past' : isToday ? 'today' : 'upcoming';
                    const statusColor = isPast ? '#718096' : isToday ? '#38a169' : '#3182ce';
                    
                    return `
                        <tr id="lesson-${lesson.id}" style="${isPast ? 'opacity: 0.7;' : ''}">
                            <td>${lesson.student_name}</td>
                            <td>${formatDate(lesson.lesson_date)}</td>
                            <td>${lesson.lesson_time}</td>
                            <td>${lesson.duration} min</td>
                            <td><span class="badge">${lesson.instrument}</span></td>
                            <td><span class="status" style="background: ${statusColor}20; color: ${statusColor};">${status.charAt(0).toUpperCase() + status.slice(1)}</span></td>
                            <td>
                                ${!isPast ? `
                                    <button type="button" class="btn" style="background: #4a90e2; padding: 0.25rem 0.5rem; margin: 0; margin-right: 0.25rem;" onclick="editLesson(${lesson.id})">Edit</button>
                                    <button type="button" class="btn" style="background: #dc3545; padding: 0.25rem 0.5rem; margin: 0;" onclick="deleteLesson(${lesson.id})">Cancel</button>
                                ` : '<span style="color: #718096; font-size: 0.9em;">Completed</span>'}
                            </td>
                        </tr>
                    `;
                }).join('')}
            </tbody>
        </table>
    `;
    scheduledLessons.innerHTML = table;
}

function selectStudentForLesson(studentId, studentName, instrument) {
    // Auto-fill the lesson form
    document.getElementById('student_id').value = studentId;
    document.getElementById('instrument').value = instrument;
    
    // Scroll to the form
    document.getElementById('schedule-form').scrollIntoView({ behavior: 'smooth' });
    
    showAlert(`${studentName} selected for lesson scheduling`, 'success');
}

function filterLessons() {
    const filterDate = document.getElementById('filter-date').value;
    if (!filterDate) {
        showAlert('Please select a date to filter', 'error');
        return;
    }
    
    const filteredLessons = allLessons.filter(lesson => lesson.lesson_date === filterDate);
    displayLessons(filteredLessons);
}

function clearFilter() {
    document.getElementById('filter-date').value = '';
    displayLessons(allLessons);
}

async function editLesson(lessonId) {
    const lesson = allLessons.find(l => l.id === lessonId);
    if (!lesson) return;
    
    // Create a modal dialog for editing
    const modal = document.createElement('div');
    modal.style.cssText = `
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
        background: rgba(0,0,0,0.5); display: flex; justify-content: center; 
        align-items: center; z-index: 1000;
    `;
    
    modal.innerHTML = `
        <div style="background: white; padding: 2rem; border-radius: 10px; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto;">
            <h3 style="margin-bottom: 1rem; color: #5a67d8;">Edit Lesson</h3>
            <form id="edit-lesson-form">
                <div style="margin-bottom: 1rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: #4a5568;">Student:</label>
                    <select id="edit-student-id" required style="width: 100%; padding: 0.5rem; border: 1px solid #e2e8f0; border-radius: 4px;">
                        ${allStudents.map(student => `<option value="${student.id}" ${student.id === lesson.student_id ? 'selected' : ''}>${student.name} - ${student.instrument}</option>`).join('')}
                    </select>
                </div>
                <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
                    <div style="flex: 1;">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: #4a5568;">Date:</label>
                        <input type="date" id="edit-lesson-date" required style="width: 100%; padding: 0.5rem; border: 1px solid #e2e8f0; border-radius: 4px;" value="${lesson.lesson_date}">
                    </div>
                    <div style="flex: 1;">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: #4a5568;">Time:</label>
                        <input type="time" id="edit-lesson-time" required style="width: 100%; padding: 0.5rem; border: 1px solid #e2e8f0; border-radius: 4px;">
                    </div>
                </div>
                <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
                    <div style="flex: 1;">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: #4a5568;">Duration:</label>
                        <select id="edit-duration" required style="width: 100%; padding: 0.5rem; border: 1px solid #e2e8f0; border-radius: 4px;">
                            <option value="30" ${lesson.duration === 30 ? 'selected' : ''}>30 minutes</option>
                            <option value="45" ${lesson.duration === 45 ? 'selected' : ''}>45 minutes</option>
                            <option value="60" ${lesson.duration === 60 ? 'selected' : ''}>60 minutes</option>
                            <option value="90" ${lesson.duration === 90 ? 'selected' : ''}>90 minutes</option>
                        </select>
                    </div>
                    <div style="flex: 1;">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: #4a5568;">Instrument:</label>
                        <select id="edit-instrument" required style="width: 100%; padding: 0.5rem; border: 1px solid #e2e8f0; border-radius: 4px;">
                            <option value="Piano" ${lesson.instrument === 'Piano' ? 'selected' : ''}>Piano</option>
                            <option value="Guitar" ${lesson.instrument === 'Guitar' ? 'selected' : ''}>Guitar</option>
                            <option value="Violin" ${lesson.instrument === 'Violin' ? 'selected' : ''}>Violin</option>
                            <option value="Drums" ${lesson.instrument === 'Drums' ? 'selected' : ''}>Drums</option>
                            <option value="Voice" ${lesson.instrument === 'Voice' ? 'selected' : ''}>Voice</option>
                            <option value="Saxophone" ${lesson.instrument === 'Saxophone' ? 'selected' : ''}>Saxophone</option>
                            <option value="Flute" ${lesson.instrument === 'Flute' ? 'selected' : ''}>Flute</option>
                            <option value="Trumpet" ${lesson.instrument === 'Trumpet' ? 'selected' : ''}>Trumpet</option>
                            <option value="Cello" ${lesson.instrument === 'Cello' ? 'selected' : ''}>Cello</option>
                            <option value="Bass" ${lesson.instrument === 'Bass' ? 'selected' : ''}>Bass</option>
                        </select>
                    </div>
                </div>
                <div style="margin-bottom: 1rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: #4a5568;">Notes:</label>
                    <textarea id="edit-notes" rows="3" style="width: 100%; padding: 0.5rem; border: 1px solid #e2e8f0; border-radius: 4px;">${lesson.notes || ''}</textarea>
                </div>
                <div style="display: flex; gap: 0.5rem;">
                    <button type="submit" style="flex: 1; background: #5a67d8; color: white; padding: 0.75rem; border: none; border-radius: 4px; cursor: pointer;">Update Lesson</button>
                    <button type="button" onclick="this.closest('.modal-container').remove()" style="flex: 1; background: #718096; color: white; padding: 0.75rem; border: none; border-radius: 4px; cursor: pointer;">Cancel</button>
                </div>
            </form>
        </div>
    `;
    modal.className = 'modal-container';
    
    document.body.appendChild(modal);
    
    // Set the time value
    document.getElementById('edit-lesson-time').value = convertTo24Hour(lesson.lesson_time);
    
    // Handle form submission
    document.getElementById('edit-lesson-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const formData = {
            lesson_date: document.getElementById('edit-lesson-date').value,
            lesson_time: document.getElementById('edit-lesson-time').value,
            duration: parseInt(document.getElementById('edit-duration').value),
            instrument: document.getElementById('edit-instrument').value,
            notes: document.getElementById('edit-notes').value
        };
        
        try {
            const response = await fetch(`/api/instructor/lessons/${lessonId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(formData)
            });
            
            const result = await response.json();
            
            if (response.ok) {
                modal.remove();
                loadScheduledLessons();
                showAlert(result.message, 'success');
            } else {
                showAlert(result.error || 'Failed to update lesson', 'error');
            }
        } catch (error) {
            console.error('Error updating lesson:', error);
            showAlert('Error updating lesson', 'error');
        }
    });
}

async function deleteLesson(lessonId) {
    if (!confirm('Are you sure you want to cancel this lesson?')) {
        return;
    }
    
    try {
        const response = await fetch(`/api/instructor/lessons/${lessonId}`, {
            method: 'DELETE'
        });
        
        const result = await response.json();
        
        if (response.ok) {
            loadScheduledLessons();
            showAlert(result.message, 'success');
        } else {
            showAlert(result.error || 'Failed to cancel lesson', 'error');
        }
    } catch (error) {
        console.error('Error canceling lesson:', error);
        showAlert('Error canceling lesson', 'error');
    }
}

function formatDate(dateString) {
    const date = new Date(dateString);
    return date.toLocaleDateString('en-US', { 
        weekday: 'short', 
        year: 'numeric', 
        month: 'short', 
        day: 'numeric' 
    });
}

function convertTo24Hour(time12h) {
    if (!time12h) return '';
    
    try {
        // Handle various formats
        const time = time12h.toLowerCase().replace(/\s/g, '');
        const isAM = time.includes('am');
        const isPM = time.includes('pm');
        
        if (!isAM && !isPM) {
            // Already 24-hour format or no AM/PM
            return time;
        }
        
        let [hours, minutes] = time.replace(/[ap]m/, '').split(':');
        hours = parseInt(hours, 10);
        minutes = minutes || '00';
        
        if (isPM && hours !== 12) {
            hours += 12;
        } else if (isAM && hours === 12) {
            hours = 0;
        }
        
        return `${hours.toString().padStart(2, '0')}:${minutes}`;
    } catch (error) {
        console.error('Time conversion error:', error);
        return time12h;
    }
}

function convertTo12Hour(time24h) {
    if (!time24h) return '';
    
    try {
        const [hours, minutes] = time24h.split(':');
        let hour12 = parseInt(hours, 10);
        const ampm = hour12 >= 12 ? 'PM' : 'AM';
        
        if (hour12 === 0) {
            hour12 = 12;
        } else if (hour12 > 12) {
            hour12 -= 12;
        }
        
        return `${hour12}:${minutes} ${ampm}`;
    } catch (error) {
        console.error('Time conversion error:', error);
        return time24h;
    }
}

function showAlert(message, type) {
    // Remove existing alerts
    const existingAlerts = document.querySelectorAll('.dynamic-alert');
    existingAlerts.forEach(alert => alert.remove());
    
    const alert = document.createElement('div');
    alert.className = `alert alert-${type} dynamic-alert`;
    alert.textContent = message;
    alert.style.marginBottom = '1rem';
    
    // Insert after the header
    const header = document.querySelector('.header');
    if (header.nextSibling) {
        header.parentNode.insertBefore(alert, header.nextSibling);
    } else {
        header.parentNode.appendChild(alert);
    }
    
    // Auto-remove after 5 seconds
    setTimeout(() => {
        alert.remove();
    }, 5000);
}

        // Simple form validation
        function validateForm(form) {
            const inputs = form.querySelectorAll('input[required], select[required]');
            for (let input of inputs) {
                if (!input.value.trim()) {
                    alert('Please fill in all required fields');
                    input.focus();
                    return false;
                }
            }
            return true;
        }
        
        // Add form validation to all forms
        document.addEventListener('DOMContentLoaded', function() {
            const forms = document.querySelectorAll('form');
            forms.forEach(form => {
                form.addEventListener('submit', function(e) {
                    if (!validateForm(this)) {
                        e.preventDefault();
                    }
                });
            });
        });

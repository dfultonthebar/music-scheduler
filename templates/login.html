
{% extends "base.html" %}

{% block title %}Login - Music Scheduler{% endblock %}

{% block content %}
<div class="header">
    <h1>🎵 Music Scheduler</h1>
    <p>User Login Portal</p>
</div>

{% if error %}
<div class="alert alert-error">
    {{ error }}
</div>
{% endif %}

{% if success %}
<div class="alert alert-success">
    {{ success }}
</div>
{% endif %}

<form method="POST" action="/login">
    <div class="form-group">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
    </div>
    
    <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
    </div>
    
    <button type="submit" class="btn">Login</button>
</form>

<div style="margin-top: 2rem; text-align: center; color: #718096; font-size: 0.9rem;">
    <p>Use your credentials to access the music scheduler system.</p>
</div>
{% endblock %}

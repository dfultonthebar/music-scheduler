
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Music Scheduler{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            padding: 2rem;
            min-width: 400px;
            max-width: 800px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .header h1 {
            color: #5a67d8;
            margin-bottom: 0.5rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #4a5568;
        }
        
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #5a67d8;
            box-shadow: 0 0 0 3px rgba(90, 103, 216, 0.1);
        }
        
        .btn {
            background: #5a67d8;
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
        }
        
        .btn:hover {
            background: #4c51bf;
        }
        
        .btn-secondary {
            background: #718096;
            margin-top: 1rem;
        }
        
        .btn-secondary:hover {
            background: #4a5568;
        }
        
        .alert {
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 6px;
        }
        
        .alert-error {
            background: #fed7d7;
            color: #c53030;
            border: 1px solid #feb2b2;
        }
        
        .alert-success {
            background: #c6f6d5;
            color: #276749;
            border: 1px solid #9ae6b4;
        }
        
        .nav {
            margin-bottom: 2rem;
            text-align: center;
        }
        
        .nav a {
            color: #5a67d8;
            text-decoration: none;
            margin: 0 1rem;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        
        .nav a:hover {
            background: #e2e8f0;
        }
        
        .nav-link {
            display: inline-block;
            margin: 0 0.5rem;
            padding: 0.5rem 1rem;
            background: #f7fafc;
            border-radius: 6px;
            text-decoration: none;
            color: #5a67d8 !important;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .nav-link:hover {
            background: #5a67d8;
            color: white !important;
            transform: translateY(-1px);
        }
        
        .section {
            margin-bottom: 2rem;
            padding: 1.5rem;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
        }
        
        .section h2 {
            color: #2d3748;
            margin-bottom: 1rem;
            border-bottom: 2px solid #5a67d8;
            padding-bottom: 0.5rem;
        }
        
        .form-row {
            display: flex;
            gap: 1rem;
        }
        
        .form-row .form-group {
            flex: 1;
        }
        
        .list-item {
            padding: 0.75rem;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .list-item:last-child {
            border-bottom: none;
        }
        
        .badge {
            background: #5a67d8;
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        
        th, td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        
        th {
            background: #f7fafc;
            font-weight: 600;
            color: #4a5568;
        }
        
        .status {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        
        .status.admin {
            background: #c6f6d5;
            color: #276749;
        }
        
        .status.instructor {
            background: #bee3f8;
            color: #2b6cb0;
        }
        
        .status.student {
            background: #fbb6ce;
            color: #97266d;
        }
        
        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalSlideIn 0.3s ease-out;
        }
        
        @keyframes modalSlideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .modal-header {
            padding: 1.5rem 1.5rem 1rem 1.5rem;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-header h3 {
            color: #2d3748;
            margin: 0;
        }
        
        .close {
            color: #718096;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
        }
        
        .close:hover,
        .close:focus {
            color: #2d3748;
        }
        
        .modal-body {
            padding: 1.5rem;
        }
        
        .modal-footer {
            padding: 1rem 1.5rem;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }
        
        .modal-footer .btn {
            width: auto;
            min-width: 120px;
        }
        
        /* Button Variants */
        .btn-sm {
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
        }
        
        .btn-warning {
            background: #ed8936;
            color: white;
        }
        
        .btn-warning:hover {
            background: #dd6b20;
        }
        
        .btn-primary {
            background: #5a67d8;
            color: white;
        }
        
        .btn-primary:hover {
            background: #4c51bf;
        }
        
        .btn:disabled {
            background: #a0aec0;
            cursor: not-allowed;
        }
        
        .btn:disabled:hover {
            background: #a0aec0;
        }
        
        /* Form Elements */
        .readonly-input {
            background: #f7fafc !important;
            color: #4a5568 !important;
            cursor: not-allowed;
        }
        
        .form-help {
            display: block;
            color: #718096;
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }
        
        /* Message Styles */
        .error-message {
            background: #fed7d7;
            color: #c53030;
            border: 1px solid #feb2b2;
            padding: 0.75rem;
            border-radius: 6px;
            margin-top: 1rem;
        }
        
        .success-message {
            background: #c6f6d5;
            color: #276749;
            border: 1px solid #9ae6b4;
            padding: 0.75rem;
            border-radius: 6px;
            margin-top: 1rem;
        }
        
        /* Badge Variants */
        .badge.user {
            background: #5a67d8;
            color: white;
        }
        
        .badge.student {
            background: #ed64a6;
            color: white;
        }
        
        /* Text Utilities */
        .text-muted {
            color: #a0aec0;
            font-style: italic;
        }
        
        /* Container Adjustments for Dashboard */
        body.dashboard {
            align-items: flex-start;
            padding: 2rem 0;
        }
        
        body.dashboard .container {
            max-width: 1200px;
            width: 95%;
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
            }
            
            .modal-content {
                width: 95%;
            }
            
            .modal-footer {
                flex-direction: column;
            }
            
            .modal-footer .btn {
                width: 100%;
            }
        }
        
        /* Email Service Toggle Styles */
        .email-service-status {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            border-left: 4px solid #5a67d8;
        }
        
        .service-status-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .status-display {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        .status-indicator.enabled {
            background-color: #28a745;
            box-shadow: 0 0 10px rgba(40, 167, 69, 0.5);
        }
        
        .status-indicator.disabled {
            background-color: #dc3545;
            box-shadow: 0 0 10px rgba(220, 53, 69, 0.5);
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .toggle-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }
        
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }
        
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        
        input:checked + .toggle-slider {
            background-color: #28a745;
        }
        
        input:focus + .toggle-slider {
            box-shadow: 0 0 1px #28a745;
        }
        
        input:checked + .toggle-slider:before {
            transform: translateX(26px);
        }
        
        .toggle-label {
            font-weight: 500;
            color: #333;
        }
        
        .service-status-details {
            color: #6c757d;
            font-size: 12px;
        }
        
        @media (max-width: 768px) {
            .service-status-info {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }
            
            .toggle-container {
                align-self: flex-end;
            }
        }

        /* ========================
           USER DELETION UI STYLES
           ======================== */
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .bulk-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .actions-cell {
            white-space: nowrap;
        }
        
        .btn-small {
            padding: 5px 12px;
            font-size: 12px;
            min-width: auto;
        }
        
        .btn-danger {
            background-color: #dc3545;
            color: white;
            border: 1px solid #dc3545;
        }
        
        .btn-danger:hover {
            background-color: #c82333;
            border-color: #bd2130;
            transform: translateY(-1px);
            box-shadow: 0 2px 6px rgba(220, 53, 69, 0.3);
        }
        
        .btn-danger:disabled {
            background-color: #6c757d;
            border-color: #6c757d;
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .btn-secondary {
            background-color: #6c757d;
            color: white;
            border: 1px solid #6c757d;
        }
        
        .btn-secondary:hover {
            background-color: #545b62;
            border-color: #4e555b;
            transform: translateY(-1px);
            box-shadow: 0 2px 6px rgba(108, 117, 125, 0.3);
        }
        
        /* Table checkbox styling */
        table input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            margin: 0;
        }
        
        table thead input[type="checkbox"] {
            background-color: #e9ecef;
        }
        
        table tr:hover {
            background-color: #f8f9fa;
        }
        
        table tr[data-user-id]:hover,
        table tr[data-student-id]:hover {
            background-color: #fff3cd;
            transition: background-color 0.2s;
        }
        
        /* Audit Modal Styles */
        .audit-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .audit-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 90%;
            max-height: 90%;
            overflow-y: auto;
            width: 800px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .audit-content h2 {
            margin: 0 0 20px 0;
            color: #333;
        }
        
        .audit-content table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        
        .audit-content th,
        .audit-content td {
            padding: 10px;
            border: 1px solid #dee2e6;
            text-align: left;
        }
        
        .audit-content thead tr {
            background-color: #f8f9fa;
        }
        
        .audit-content tbody tr:nth-child(even) {
            background-color: #f8f9fa;
        }
        
        /* Status badges in audit log */
        .audit-content .status {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .audit-content .status.admin {
            background-color: #dc3545;
            color: white;
        }
        
        .audit-content .status.instructor {
            background-color: #007bff;
            color: white;
        }
        
        .audit-content .status.student {
            background-color: #28a745;
            color: white;
        }
        
        /* Warning and confirmation dialogs styling */
        .deletion-warning {
            background-color: #fff3cd;
            border: 1px solid #ffeaa7;
            color: #856404;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
        }
        
        .deletion-impact {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
        }
        
        /* Loading states */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 5px;
        }
        
        .loading-spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Mobile responsiveness for deletion UI */
        @media (max-width: 768px) {
            .section-header {
                flex-direction: column;
                align-items: stretch;
            }
            
            .bulk-actions {
                justify-content: center;
                margin-top: 10px;
            }
            
            .btn-small {
                font-size: 11px;
                padding: 4px 8px;
            }
            
            .actions-cell {
                text-align: center;
            }
            
            .audit-content {
                width: 95%;
                padding: 20px;
            }
            
            .audit-content table {
                font-size: 12px;
            }
            
            .audit-content th,
            .audit-content td {
                padding: 5px;
                word-break: break-word;
            }
        }
        
        @media (max-width: 480px) {
            .bulk-actions {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
            
            /* Stack table cells vertically on very small screens */
            .audit-content table,
            .audit-content thead,
            .audit-content tbody,
            .audit-content th,
            .audit-content td,
            .audit-content tr {
                display: block;
            }
            
            .audit-content thead tr {
                position: absolute;
                top: -9999px;
                left: -9999px;
            }
            
            .audit-content tr {
                border: 1px solid #ccc;
                margin-bottom: 10px;
            }
            
            .audit-content td {
                border: none;
                border-bottom: 1px solid #eee;
                position: relative;
                padding-left: 50%;
            }
            
            .audit-content td:before {
                content: attr(data-label);
                position: absolute;
                left: 6px;
                width: 45%;
                padding-right: 10px;
                white-space: nowrap;
                font-weight: bold;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    
    <script>
        // Simple form validation
        function validateForm(form) {
            const inputs = form.querySelectorAll('input[required], select[required]');
            for (let input of inputs) {
                if (!input.value.trim()) {
                    alert('Please fill in all required fields');
                    input.focus();
                    return false;
                }
            }
            return true;
        }
        
        // Add form validation to all forms
        document.addEventListener('DOMContentLoaded', function() {
            const forms = document.querySelectorAll('form');
            forms.forEach(form => {
                form.addEventListener('submit', function(e) {
                    if (!validateForm(this)) {
                        e.preventDefault();
                    }
                });
            });
        });
    </script>
</body>
</html>
